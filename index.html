<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bāgh Cottons — Summer Edit 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #EEECEA;
  font-family: 'Montserrat', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ── LOADER ─────────────────────────────────────────── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #EEECEA;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  transition: opacity .9s ease;
}
#loader.gone { opacity: 0; pointer-events: none; }
.ld-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 5vw, 38px);
  letter-spacing: clamp(8px, 3vw, 18px);
  color: #1A130A; font-weight: 300; text-transform: uppercase;
}
.ld-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(10px, 1.8vw, 12px);
  letter-spacing: 5px; color: #9A8870; font-style: italic;
}
.ld-bar { width: min(180px, 48vw); height: 1px; background: #D8D0C6; position: relative; overflow: hidden; }
.ld-fill { position: absolute; inset: 0 auto 0 0; background: #1A130A; width: 0%; transition: width .08s linear; }
.ld-pct { font-size: 8px; letter-spacing: 3px; color: #B8AEA0; text-transform: uppercase; }

/* ── TOPBAR ─────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 50px; z-index: 300;
  background: #EEECEA;
  border-bottom: 1px solid #DEDAD4;
  display: flex; align-items: center; padding: 0 22px;
}
.tb-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(12px, 2.2vw, 18px);
  letter-spacing: clamp(3px, 1.5vw, 8px);
  color: #1A130A; font-weight: 400; text-transform: uppercase; flex: 1;
}
.tb-right {
  display: flex; align-items: center; gap: 14px;
  font-size: 8px; letter-spacing: 3px; color: #9A8870; text-transform: uppercase;
}
.tb-rule { width: 18px; height: 1px; background: #B8AEA0; }
.tb-actions { display: flex; gap: 2px; margin-left: 12px; }
.tb-icon {
  width: 30px; height: 30px; border-radius: 2px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #7A6A58; transition: color .2s, background .15s;
}
.tb-icon:hover { color: #1A130A; background: rgba(0,0,0,0.04); }
.tb-icon svg { width: 14px; height: 14px; fill: currentColor; pointer-events: none; }

@media (max-width: 480px) { .tb-right { display: none; } }

/* ── SCENE ──────────────────────────────────────────── */
#scene {
  position: fixed;
  top: 50px; left: 0; right: 0; bottom: 0;
  background: #EEECEA;
  overflow: hidden;
  /* Soft vignette like a reading table */
  background-image: radial-gradient(ellipse at 50% 40%,
    #F2F0ED 0%, #E8E5E0 55%, #DDD9D2 100%);
}

/* ── BOOK — absolutely centered, the reliable way ───── */
#book-wrapper {
  position: absolute;
  /* We set top/left/transform via JS after we know dimensions */
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  /* Smooth cover-centering shift */
  transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1),
              filter 0.25s ease;
  /* Luxury book shadow on light surface */
  filter:
    drop-shadow(0 1px 3px rgba(0,0,0,0.07))
    drop-shadow(0 6px 18px rgba(0,0,0,0.10))
    drop-shadow(0 20px 50px rgba(0,0,0,0.09))
    drop-shadow(0 50px 90px rgba(0,0,0,0.07));
  will-change: transform;
}

/* Page divs — sized by JS */
.page { background: #F4F0E8; overflow: hidden; }
.page img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none;
  /* Prevent browser blurring on non-integer scaling */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
  -ms-interpolation-mode: bicubic;
}

/* StPageFlip canvas white-fill fix applied in JS */
.stf__parent, .stf__block { background: transparent !important; }

/* Spine line — shows on spreads */
#spine-line {
  position: absolute;
  top: 0; bottom: 0; z-index: 20; pointer-events: none;
  width: 1px;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.03) 0%,
    rgba(0,0,0,0.12) 25%,
    rgba(0,0,0,0.16) 50%,
    rgba(0,0,0,0.12) 75%,
    rgba(0,0,0,0.03) 100%);
  transition: opacity 0.3s;
  opacity: 0; /* shown only on spreads */
}

/* ── FLOATING ARROWS ────────────────────────────────── */
/* Positioned fixed relative to scene, always at mid-height */
#nav-prev, #nav-next {
  position: fixed; top: 50%; z-index: 200;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  padding: 8px; transition: opacity .25s;
  opacity: 0;
}
#scene:hover ~ #nav-prev,
#scene:hover ~ #nav-next,
#nav-prev:hover, #nav-next:hover { opacity: 1; }
#nav-prev { left: clamp(8px, 2vw, 28px); }
#nav-next { right: clamp(8px, 2vw, 28px); }
#nav-prev:disabled, #nav-next:disabled { opacity: 0 !important; pointer-events: none; }

/* Touch: always show */
@media (hover: none) {
  #nav-prev, #nav-next { opacity: 1 !important; }
}

.arr {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(238,236,234,0.88);
  border: 1px solid rgba(0,0,0,0.09);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 14px rgba(0,0,0,0.09);
  transition: transform .15s, box-shadow .15s;
}
#nav-prev:not(:disabled):hover .arr,
#nav-next:not(:disabled):hover .arr {
  transform: scale(1.1);
  box-shadow: 0 4px 22px rgba(0,0,0,0.14);
}
.arr svg { width: 16px; height: 16px; fill: #1A130A; }

/* ── PAGE LABEL ─────────────────────────────────────── */
#page-label {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: 9px; letter-spacing: 4px;
  color: #B8A898; text-transform: uppercase;
  pointer-events: none; white-space: nowrap; z-index: 200;
}

/* ── PROGRESS LINE ──────────────────────────────────── */
#progress {
  position: fixed;
  top: 50px; left: 0; right: 0; height: 1px;
  background: rgba(0,0,0,0.06); z-index: 200;
}
#progress-fill {
  height: 100%; width: 0%;
  background: #1A130A;
  transition: width .35s ease;
}

/* ── THUMBNAIL PANEL ────────────────────────────────── */
#thumbs {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 0; overflow: hidden;
  background: #EEECEA; border-top: 1px solid #DEDAD4;
  transition: height .3s cubic-bezier(.4,0,.2,1); z-index: 280;
}
#thumbs.open { height: 120px; }
#t-scroll {
  display: flex; gap: 7px; padding: 12px 18px;
  overflow-x: auto; height: 100%; align-items: center;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin; scrollbar-color: #C8B898 transparent;
}
#t-scroll::-webkit-scrollbar { height: 2px; }
#t-scroll::-webkit-scrollbar-thumb { background: #C8B898; border-radius: 1px; }
.ti {
  flex-shrink: 0; height: 88px; border: 1.5px solid transparent;
  border-radius: 1px; cursor: pointer;
  transition: border-color .18s, opacity .18s; opacity: 0.42;
}
.ti:hover { opacity: 0.72; }
.ti.on { border-color: #1A130A; opacity: 1; }
.ti img { height: 100%; width: auto; display: block; }
</style>
</head>

</script>
<script>
/* ══════════════════════════════════════════════════
   CANVAS PATCH — transparent instead of white fill
══════════════════════════════════════════════════ */
(function() {
  const _orig = CanvasRenderingContext2D.prototype.fillRect;
  CanvasRenderingContext2D.prototype.fillRect = function(x,y,w,h) {
    const fs = this.fillStyle;
    if ((fs==='white'||fs==='#fff'||fs==='#ffffff') && x===0 && y===0) {
      this.clearRect(0,0,w,h); return;
    }
    _orig.call(this,x,y,w,h);
  };
})();

/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const TOTAL = 24;
const RATIO = 2550 / 1650; // page h/w
const TOPBAR_H = 50;
const sndEl = document.getElementById('snd');

let pf       = null;
let curPage  = 0;
let isPhone  = false;
let pageW    = 0;   // stored page width for cover shift
let thumbsOpen = false;

/* ══════════════════════════════════════════════════
   SOUND — plain Audio element: works on file://, Safari, all browsers
══════════════════════════════════════════════════ */
function playFlip() {
  try {
    // Clone and play so rapid flips don't block
    const clone = sndEl.cloneNode();
    clone.volume = 0.65;
    clone.play().catch(()=>{});
    setTimeout(()=>clone.remove(), 1000);
  } catch(e) {}
}

/* ══════════════════════════════════════════════════
   SIZING — uses window dimensions, very reliable
══════════════════════════════════════════════════ */
function getDims() {
  const W = window.innerWidth;
  const H = window.innerHeight - TOPBAR_H;
  const phone = W < 620;

  // Generous padding so nothing is cropped
  const padW = phone ? 12 : 70;
  const padH = phone ? 10 : 36;
  const avW = W - padW * 2;
  const avH = H - padH * 2;

  let pw, ph;
  if (phone) {
    // Single page — portrait
    pw = Math.min(avW, Math.floor(avH / RATIO));
    ph = Math.floor(pw * RATIO);
    if (ph > avH) { ph = avH; pw = Math.floor(ph / RATIO); }
  } else {
    // Two-page spread: book width = 2 × pw
    pw = Math.min(Math.floor(avW / 2), Math.floor(avH / RATIO));
    ph = Math.floor(pw * RATIO);
    if (ph > avH) { ph = avH; pw = Math.floor(ph / RATIO); }
  }
  return { w: Math.max(pw,40), h: Math.max(ph,40), phone };
}

/* ══════════════════════════════════════════════════
   COVER SHIFT
   StPageFlip puts cover on the RIGHT half of the
   double-width canvas → shift wrapper left by pw/2
   Back cover on LEFT half → shift right by pw/2
══════════════════════════════════════════════════ */
function applyCoverShift(p) {
  const wrapper = document.getElementById('book-wrapper');
  const spine   = document.getElementById('spine-line');

  if (isPhone) {
    wrapper.style.transform = 'translate(-50%, -50%)';
    spine.style.opacity = '0';
    return;
  }

  if (p === 0) {
    // Cover on right half → shift wrapper LEFT by pw/2
    wrapper.style.transform = `translate(calc(-50% - ${pageW/2}px), -50%)`;
    spine.style.opacity = '0';
  } else if (p >= TOTAL - 1) {
    // Back cover on left half → shift wrapper RIGHT by pw/2
    wrapper.style.transform = `translate(calc(-50% + ${pageW/2}px), -50%)`;
    spine.style.opacity = '0';
  } else {
    wrapper.style.transform = 'translate(-50%, -50%)';
    spine.style.opacity = '1';
  }
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
function initBook(startPage) {
  const { w, h, phone } = getDims();
  isPhone = phone;
  pageW = w;

  // Size page divs
  document.querySelectorAll('.page').forEach(pg => {
    pg.style.width  = w + 'px';
    pg.style.height = h + 'px';
  });

  // Position spine line
  const sl = document.getElementById('spine-line');
  sl.style.left   = w + 'px'; // center of book (between the two pages)
  sl.style.height = h + 'px';

  // Clear any existing StPageFlip DOM
  if (pf) { try { pf.destroy(); } catch(e) {} pf = null; }

  pf = new St.PageFlip(document.getElementById('flipbook'), {
    width:  w,
    height: h,
    size: 'fixed',
    showCover: true,
    drawShadow: true,
    flippingTime: 680,
    usePortrait: phone,
    startZIndex: 5,
    maxShadowOpacity: 0.38,
    mobileScrollSupport: false,
    swipeDistance: 20,
    clickEventForward: false,
    useMouseEvents: true,
    autoSize: false,   // we control sizing
  });

  pf.loadFromHTML(document.querySelectorAll('.page'));

  pf.on('flip', e => {
    curPage = e.data;
    refreshUI();
    playFlip();
  });

  pf.on('init', () => {
    const sp = (typeof startPage==='number') ? startPage : 0;
    curPage = sp;
    if (sp > 0) setTimeout(()=>{ pf.turnToPage(sp); refreshUI(); }, 60);
    else refreshUI();
  });
}

/* ══════════════════════════════════════════════════
   UI REFRESH
══════════════════════════════════════════════════ */
function refreshUI() {
  const p = curPage;

  // Label
  const lbl = document.getElementById('page-label');
  if (p===0)          lbl.textContent = 'Cover';
  else if (p>=TOTAL-1) lbl.textContent = 'Back Cover';
  else                lbl.textContent = p + ' / ' + (TOTAL-2);

  // Progress
  document.getElementById('progress-fill').style.width =
    Math.round(p/(TOTAL-1)*100)+'%';

  // Arrows
  document.getElementById('nav-prev').disabled = p===0;
  document.getElementById('nav-next').disabled = p>=TOTAL-1;

  // Cover shift
  applyCoverShift(p);

  // Active thumb
  document.querySelectorAll('.ti').forEach(t=>t.classList.remove('on'));
  const at = document.querySelector(`.ti[data-p="${p}"]`);
  if (at) at.classList.add('on');
}

/* ══════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════ */
function goNext()  { pf?.flipNext('bottom'); }
function goPrev()  { pf?.flipPrev('bottom'); }
function goFirst() { pf?.turnToPage(0); curPage=0; refreshUI(); }
function goLast()  { pf?.turnToPage(TOTAL-1); curPage=TOTAL-1; refreshUI(); }

document.addEventListener('keydown', e => {
  if      (e.key==='ArrowRight'||e.key==='PageDown') goNext();
  else if (e.key==='ArrowLeft' ||e.key==='PageUp')   goPrev();
  else if (e.key==='Home') goFirst();
  else if (e.key==='End')  goLast();
  else if (e.key==='f'||e.key==='F') toggleFS();
  else if (e.key==='Escape'&&thumbsOpen) toggleThumbs();
});

/* ══════════════════════════════════════════════════
   THUMBNAILS
══════════════════════════════════════════════════ */
function buildThumbs() {
  const sc = document.getElementById('t-scroll');
  document.querySelectorAll('.page img').forEach((img,i) => {
    const d = document.createElement('div');
    d.className='ti'; d.dataset.p=i;
    const im = document.createElement('img');
    im.src=img.src; im.loading='lazy';
    d.appendChild(im);
    d.onclick = () => {
      if (i===0||i===TOTAL-1) { pf?.turnToPage(i); curPage=i; refreshUI(); }
      else pf?.flip(i,'bottom');
      toggleThumbs();
    };
    sc.appendChild(d);
  });
}

function toggleThumbs() {
  thumbsOpen = !thumbsOpen;
  document.getElementById('thumbs').classList.toggle('open', thumbsOpen);
  if (thumbsOpen) setTimeout(()=>{
    const at=document.querySelector('.ti.on');
    if(at) at.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  },340);
}

/* ══════════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════════ */
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* ══════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════ */
let _rt;
window.addEventListener('resize', ()=>{
  clearTimeout(_rt);
  _rt = setTimeout(()=>{
    if (!pf) return;
    const {w,h,phone} = getDims();
    const saved = curPage;
    if (phone!==isPhone) {
      document.querySelectorAll('.page').forEach(pg=>{pg.style.width=w+'px';pg.style.height=h+'px';});
      initBook(saved);
    } else {
      pageW = w;
      document.querySelectorAll('.page').forEach(pg=>{pg.style.width=w+'px';pg.style.height=h+'px';});
      document.getElementById('spine-line').style.left = w+'px';
      document.getElementById('spine-line').style.height = h+'px';
      pf.update();
      setTimeout(()=>applyCoverShift(curPage), 80);
    }
  }, 220);
});
window.addEventListener('orientationchange', ()=>setTimeout(()=>window.dispatchEvent(new Event('resize')), 420));

/* ══════════════════════════════════════════════════
   BOOT — run after full page layout is settled
══════════════════════════════════════════════════ */
window.addEventListener('load', function() {
  buildThumbs();

  // Animate loader progress
  let pct=0;
  const fill=document.getElementById('ld-fill');
  const lp=document.getElementById('ld-pct');
  const iv=setInterval(()=>{
    pct=Math.min(pct+(pct<60?6:pct<88?2:0.5),99);
    fill.style.width=pct+'%';
    lp.textContent=Math.round(pct)+'%';
  },30);

  // Init book after layout is fully settled
  setTimeout(()=>{
    clearInterval(iv);
    fill.style.width='100%'; lp.textContent='100%';
    setTimeout(()=>{
      initBook(0);
      const l=document.getElementById('loader');
      l.classList.add('gone');
      setTimeout(()=>l.remove(), 1000);
    }, 200);
  }, 900);
});
</script>
