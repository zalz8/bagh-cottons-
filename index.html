<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bāgh Cottons — Summer Edit 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: visible;
  background: #EEECEA;
  font-family: 'Montserrat', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ── LOADER ─────────────────────────────────────────── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #EEECEA;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  transition: opacity .9s ease;
}
#loader.gone { opacity: 0; pointer-events: none; }
.ld-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 5vw, 38px);
  letter-spacing: clamp(8px, 3vw, 18px);
  color: #1A130A; font-weight: 300; text-transform: uppercase;
}
.ld-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(10px, 1.8vw, 12px);
  letter-spacing: 5px; color: #9A8870; font-style: italic;
}
.ld-bar { width: min(180px, 48vw); height: 1px; background: #D8D0C6; position: relative; overflow: hidden; }
.ld-fill { position: absolute; inset: 0 auto 0 0; background: #1A130A; width: 0%; transition: width .08s linear; }
.ld-pct { font-size: 8px; letter-spacing: 3px; color: #B8AEA0; text-transform: uppercase; }

/* ── TOPBAR ─────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 50px; z-index: 300;
  background: #EEECEA;
  border-bottom: 1px solid #DEDAD4;
  display: flex; align-items: center; padding: 0 16px;
  gap: 0;
}
.tb-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(13px, 2.2vw, 18px);
  letter-spacing: clamp(3px, 1.5vw, 8px);
  color: #1A130A; font-weight: 400; text-transform: uppercase;
  flex: 1;
}

/* ── NAV ICONS (right side) ─────────────────────────── */
.tb-right {
  display: flex; align-items: center; gap: 4px;
  flex-shrink: 0;
}

/* Tab buttons */
.tb-tab-icon {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  background: none; border: none; cursor: pointer;
  padding: 6px 10px; border-radius: 4px;
  color: #B8A898;
  transition: color .2s, background .15s;
  text-decoration: none;
  position: relative;
  min-width: 44px; height: 42px;
  -webkit-tap-highlight-color: transparent;
}
.tb-tab-icon:hover { color: #1A130A; background: rgba(0,0,0,0.04); }
.tb-tab-icon.active { color: #1A130A; }
.tb-tab-icon.active::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 10px; right: 10px;
  height: 1.5px;
  background: #1A130A;
  border-radius: 1px;
}
.tb-tab-icon svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.tb-tab-icon span {
  font-family: 'Montserrat', sans-serif;
  font-size: 7.5px; letter-spacing: 2.5px; text-transform: uppercase;
  line-height: 1; white-space: nowrap;
}

/* WhatsApp icon button */
.tb-wa {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  padding: 6px 10px; border-radius: 4px;
  color: #B8A898;
  transition: color .2s, background .15s;
  text-decoration: none;
  min-width: 40px; height: 42px;
  -webkit-tap-highlight-color: transparent;
}
.tb-wa svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.tb-wa:hover { color: #25D366; background: rgba(37,211,102,0.06); }

/* thin separator */
.tb-sep {
  width: 1px; height: 20px; background: #D0C8BE;
  flex-shrink: 0; margin: 0 2px;
}

/* ── VIEWS ──────────────────────────────────────────── */
.view {
  position: fixed;
  top: 50px; left: 0; right: 0; bottom: 0;
  transition: opacity .3s ease, visibility .3s;
  overflow: hidden;
}
.view.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.view.visible { opacity: 1; visibility: visible; pointer-events: all; }

/* ── INSTAGRAM VIEW gets its own scroll override ────── */
#instagram-view {
  overflow-y: auto !important;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
#instagram-view::-webkit-scrollbar { width: 4px; }
#instagram-view::-webkit-scrollbar-thumb { background: #C8B898; border-radius: 2px; }

/* ── SCENE (lookbook) ───────────────────────────────── */
#scene {
  width: 100%; height: 100%;
  background-image: radial-gradient(ellipse at 50% 40%,
    #F2F0ED 0%, #E8E5E0 55%, #DDD9D2 100%);
  overflow: hidden;
}

/* ── BOOK ───────────────────────────────────────────── */
#book-wrapper {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1),
              filter 0.25s ease;
  filter:
    drop-shadow(0 1px 3px rgba(0,0,0,0.07))
    drop-shadow(0 6px 18px rgba(0,0,0,0.10))
    drop-shadow(0 20px 50px rgba(0,0,0,0.09))
    drop-shadow(0 50px 90px rgba(0,0,0,0.07));
  will-change: transform;
}

.page { background: #F4F0E8; overflow: hidden; }
.page img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
  -ms-interpolation-mode: bicubic;
}
.stf__parent, .stf__block { background: transparent !important; }

#spine-line {
  position: absolute;
  top: 0; bottom: 0; z-index: 20; pointer-events: none;
  width: 1px;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.03) 0%,
    rgba(0,0,0,0.12) 25%,
    rgba(0,0,0,0.16) 50%,
    rgba(0,0,0,0.12) 75%,
    rgba(0,0,0,0.03) 100%);
  transition: opacity 0.3s;
  opacity: 0;
}

/* ── FLOATING ARROWS ────────────────────────────────── */
#nav-prev, #nav-next {
  position: fixed; top: 50%; z-index: 200;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  padding: 8px; transition: opacity .25s;
  opacity: 0;
}
#scene:hover ~ #nav-prev,
#scene:hover ~ #nav-next,
#nav-prev:hover, #nav-next:hover { opacity: 1; }
#nav-prev { left: clamp(8px, 2vw, 28px); }
#nav-next { right: clamp(8px, 2vw, 28px); }
#nav-prev:disabled, #nav-next:disabled { opacity: 0 !important; pointer-events: none; }
@media (hover: none) {
  #nav-prev, #nav-next { opacity: 1 !important; }
}
.arr {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(238,236,234,0.88);
  border: 1px solid rgba(0,0,0,0.09);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 14px rgba(0,0,0,0.09);
  transition: transform .15s, box-shadow .15s;
}
#nav-prev:not(:disabled):hover .arr,
#nav-next:not(:disabled):hover .arr {
  transform: scale(1.1);
  box-shadow: 0 4px 22px rgba(0,0,0,0.14);
}
.arr svg { width: 16px; height: 16px; fill: #1A130A; }

/* ── PAGE LABEL ─────────────────────────────────────── */
#page-label {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: 9px; letter-spacing: 4px;
  color: #B8A898; text-transform: uppercase;
  pointer-events: none; white-space: nowrap; z-index: 200;
  transition: opacity .3s;
}
#page-label.hide { opacity: 0; }

/* ── PROGRESS LINE ──────────────────────────────────── */
#progress {
  position: fixed;
  top: 50px; left: 0; right: 0; height: 1px;
  background: rgba(0,0,0,0.06); z-index: 200;
  transition: opacity .3s;
}
#progress.hide { opacity: 0; }
#progress-fill {
  height: 100%; width: 0%;
  background: #1A130A;
  transition: width .35s ease;
}

/* ══════════════════════════════════════════════════════
   INSTAGRAM VIEW
══════════════════════════════════════════════════════ */
.ig-header {
  display: flex; align-items: center; gap: 16px;
  padding: clamp(24px, 5vw, 48px) clamp(20px, 5vw, 60px) clamp(16px, 3vw, 28px);
}
.ig-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  border: 1.5px solid #D0C8BE;
  object-fit: cover; flex-shrink: 0;
  background: #DDD9D2;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.ig-avatar svg { width: 28px; height: 28px; fill: #B8A898; }
.ig-handle {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(16px, 3vw, 22px);
  color: #1A130A; letter-spacing: 2px; font-weight: 400;
}
.ig-tagline {
  font-size: 8px; letter-spacing: 3px;
  color: #9A8870; text-transform: uppercase; margin-top: 3px;
}
.ig-follow-btn {
  margin-left: auto; flex-shrink: 0;
  background: #1A130A; color: #EEECEA;
  border: none; cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 7px; letter-spacing: 3px; text-transform: uppercase;
  padding: 9px 18px; border-radius: 1px;
  text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
  transition: background .2s;
}
.ig-follow-btn:hover { background: #2D2016; }
.ig-follow-btn svg { width: 11px; height: 11px; fill: currentColor; }

.ig-divider {
  width: calc(100% - clamp(40px, 10vw, 120px));
  margin: 0 auto;
  height: 1px; background: #DEDAD4;
}

.ig-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  width: 100%;
  max-width: 1100px;
  margin: 24px auto 60px;
  padding: 0 5px;
}

/* ── Instagram posts: 4:5 portrait ratio (like IG feed) */
.ig-post {
  position: relative;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  cursor: pointer;
  background: #DDD9D2;
  display: block;
  text-decoration: none;
}

.ig-post img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .5s cubic-bezier(.4,0,.2,1);
}

.ig-post:hover img { transform: scale(1.04); }

.ig-post-overlay {
  position: absolute; inset: 0;
  background: rgba(26,19,10,0);
  display: flex; align-items: center; justify-content: center;
  transition: background .3s;
}
.ig-post:hover .ig-post-overlay { background: rgba(26,19,10,0.28); }
.ig-post-overlay-inner { opacity: 0; transition: opacity .3s; }
.ig-post:hover .ig-post-overlay-inner { opacity: 1; }
.ig-stat {
  color: #EEECEA;
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  font-family: 'Montserrat', sans-serif;
}
</style>

</script>
<script>
/* ══════════════════════════════════════════════════
   CANVAS PATCH
══════════════════════════════════════════════════ */
(function() {
  const _orig = CanvasRenderingContext2D.prototype.fillRect;
  CanvasRenderingContext2D.prototype.fillRect = function(x,y,w,h) {
    const fs = this.fillStyle;
    if ((fs==='white'||fs==='#fff'||fs==='#ffffff') && x===0 && y===0) {
      this.clearRect(0,0,w,h); return;
    }
    _orig.call(this,x,y,w,h);
  };
})();

/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const TOTAL = 24;
const RATIO = 2550 / 1650;
const TOPBAR_H = 50;
const sndEl = document.getElementById('snd');

let pf       = null;
let curPage  = 0;
let isPhone  = false;
let pageW    = 0;
let currentView = 'lookbook';

/* ══════════════════════════════════════════════════
   VIEW SWITCHING
══════════════════════════════════════════════════ */
function switchView(view) {
  currentView = view;

  document.getElementById('tab-lookbook').classList.toggle('active', view === 'lookbook');
  document.getElementById('tab-instagram').classList.toggle('active', view === 'instagram');

  document.getElementById('lookbook-view').classList.toggle('visible', view === 'lookbook');
  document.getElementById('lookbook-view').classList.toggle('hidden', view !== 'lookbook');
  document.getElementById('instagram-view').classList.toggle('visible', view === 'instagram');
  document.getElementById('instagram-view').classList.toggle('hidden', view !== 'instagram');

  const isLookbook = view === 'lookbook';
  document.getElementById('nav-prev').style.display = isLookbook ? '' : 'none';
  document.getElementById('nav-next').style.display = isLookbook ? '' : 'none';
  document.getElementById('page-label').classList.toggle('hide', !isLookbook);
  document.getElementById('progress').classList.toggle('hide', !isLookbook);

  if (view === 'instagram') {
    document.getElementById('instagram-view').scrollTop = 0;
  }
}

/* ══════════════════════════════════════════════════
   SOUND
══════════════════════════════════════════════════ */
function playFlip() {
  try {
    const clone = sndEl.cloneNode();
    clone.volume = 0.65;
    clone.play().catch(()=>{});
    setTimeout(()=>clone.remove(), 1000);
  } catch(e) {}
}

/* ══════════════════════════════════════════════════
   SIZING
══════════════════════════════════════════════════ */
function getDims() {
  const W = window.innerWidth;
  const H = window.innerHeight - TOPBAR_H;
  const phone = W < 620;
  const padW = phone ? 12 : 70;
  const padH = phone ? 10 : 36;
  const avW = W - padW * 2;
  const avH = H - padH * 2;
  let pw, ph;
  if (phone) {
    pw = Math.min(avW, Math.floor(avH / RATIO));
    ph = Math.floor(pw * RATIO);
    if (ph > avH) { ph = avH; pw = Math.floor(ph / RATIO); }
  } else {
    pw = Math.min(Math.floor(avW / 2), Math.floor(avH / RATIO));
    ph = Math.floor(pw * RATIO);
    if (ph > avH) { ph = avH; pw = Math.floor(ph / RATIO); }
  }
  return { w: Math.max(pw,40), h: Math.max(ph,40), phone };
}

document.addEventListener("click", () => {
  const snd = document.getElementById("snd");
  snd.play().then(() => { snd.pause(); snd.currentTime = 0; });
}, { once: true });

/* ══════════════════════════════════════════════════
   COVER SHIFT
══════════════════════════════════════════════════ */
function applyCoverShift(p) {
  const wrapper = document.getElementById('book-wrapper');
  const spine   = document.getElementById('spine-line');
  if (isPhone) {
    wrapper.style.transform = 'translate(-50%, -50%)';
    spine.style.opacity = '0';
    return;
  }
  if (p === 0) {
    wrapper.style.transform = `translate(calc(-50% - ${pageW/2}px), -50%)`;
    spine.style.opacity = '0';
  } else if (p >= TOTAL - 1) {
    wrapper.style.transform = `translate(calc(-50% + ${pageW/2}px), -50%)`;
    spine.style.opacity = '0';
  } else {
    wrapper.style.transform = 'translate(-50%, -50%)';
    spine.style.opacity = '1';
  }
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
function initBook(startPage) {
  const { w, h, phone } = getDims();
  isPhone = phone;
  pageW = w;
  document.querySelectorAll('.page').forEach(pg => {
    pg.style.width  = w + 'px';
    pg.style.height = h + 'px';
  });
  const sl = document.getElementById('spine-line');
  sl.style.left   = w + 'px';
  sl.style.height = h + 'px';
  if (pf) { try { pf.destroy(); } catch(e) {} pf = null; }
  pf = new St.PageFlip(document.getElementById('flipbook'), {
    width:  w,
    height: h,
    size: 'fixed',
    showCover: true,
    drawShadow: true,
    flippingTime: 680,
    usePortrait: phone,
    startZIndex: 5,
    maxShadowOpacity: 0.38,
    mobileScrollSupport: false,
    swipeDistance: 20,
    clickEventForward: false,
    useMouseEvents: true,
    autoSize: false,
  });
  pf.loadFromHTML(document.querySelectorAll('.page'));
  pf.on('flip', e => {
    curPage = e.data;
    refreshUI();
    playFlip();
  });
  pf.on('init', () => {
    const sp = (typeof startPage==='number') ? startPage : 0;
    curPage = sp;
    if (sp > 0) setTimeout(()=>{ pf.turnToPage(sp); refreshUI(); }, 60);
    else refreshUI();
  });
}

/* ══════════════════════════════════════════════════
   UI REFRESH
══════════════════════════════════════════════════ */
function refreshUI() {
  const p = curPage;
  const lbl = document.getElementById('page-label');
  if (p===0)           lbl.textContent = 'Cover';
  else if (p>=TOTAL-1) lbl.textContent = 'Back Cover';
  else                 lbl.textContent = p + ' / ' + (TOTAL-2);
  document.getElementById('progress-fill').style.width =
    Math.round(p/(TOTAL-1)*100)+'%';
  document.getElementById('nav-prev').disabled = p===0;
  document.getElementById('nav-next').disabled = p>=TOTAL-1;
  applyCoverShift(p);
}

/* ══════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════ */
function goNext()  { pf?.flipNext('bottom'); }
function goPrev()  { pf?.flipPrev('bottom'); }
function goFirst() { pf?.turnToPage(0); curPage=0; refreshUI(); }
function goLast()  { pf?.turnToPage(TOTAL-1); curPage=TOTAL-1; refreshUI(); }

document.addEventListener('keydown', e => {
  if (currentView !== 'lookbook') return;
  if      (e.key==='ArrowRight'||e.key==='PageDown') goNext();
  else if (e.key==='ArrowLeft' ||e.key==='PageUp')   goPrev();
  else if (e.key==='Home') goFirst();
  else if (e.key==='End')  goLast();
  else if (e.key==='f'||e.key==='F') toggleFS();
});

/* ══════════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════════ */
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* ══════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════ */
let _rt;
window.addEventListener('resize', ()=>{
  clearTimeout(_rt);
  _rt = setTimeout(()=>{
    if (!pf) return;
    const {w,h,phone} = getDims();
    const saved = curPage;
    if (phone!==isPhone) {
      document.querySelectorAll('.page').forEach(pg=>{pg.style.width=w+'px';pg.style.height=h+'px';});
      initBook(saved);
    } else {
      pageW = w;
      document.querySelectorAll('.page').forEach(pg=>{pg.style.width=w+'px';pg.style.height=h+'px';});
      document.getElementById('spine-line').style.left = w+'px';
      document.getElementById('spine-line').style.height = h+'px';
      pf.update();
      setTimeout(()=>applyCoverShift(curPage), 80);
    }
  }, 220);
});
window.addEventListener('orientationchange', ()=>setTimeout(()=>window.dispatchEvent(new Event('resize')), 420));

/* ══════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════ */
window.addEventListener('load', function() {
  let pct=0;
  const fill=document.getElementById('ld-fill');
  const lp=document.getElementById('ld-pct');
  const iv=setInterval(()=>{
    pct=Math.min(pct+(pct<60?6:pct<88?2:0.5),99);
    fill.style.width=pct+'%';
    lp.textContent=Math.round(pct)+'%';
  },30);
  setTimeout(()=>{
    clearInterval(iv);
    fill.style.width='100%'; lp.textContent='100%';
    setTimeout(()=>{
      initBook(0);
      const l=document.getElementById('loader');
      l.classList.add('gone');
      setTimeout(()=>l.remove(), 1000);
    }, 200);
  }, 900);
});
</script>
